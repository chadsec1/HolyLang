name: Unit Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]


jobs:
  unit_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # This is 6.0.2
        with:
          fetch-depth: 0

      - name: Install nightly + llvm-cov
        run: |
          rustup toolchain install nightly --component llvm-tools-preview
          cargo install cargo-llvm-cov
      
      - name: Generate coverage
        run: cargo +nightly llvm-cov --branch --lcov --output-path coverage.lcov

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        args: >
          -Dsonar.rust.lcov.reportPaths=coverage.lcov
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

