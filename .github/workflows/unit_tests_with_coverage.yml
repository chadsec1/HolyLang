name: Unit Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]


jobs:
  unit_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # This is 6.0.2
        with:
          fetch-depth: 0

      - name: Install nightly + llvm-cov
        run: |
          rustup toolchain install nightly --component llvm-tools-preview
          cargo install cargo-llvm-cov
      
      - name: Generate coverage
        run: cargo +nightly llvm-cov --branch --lcov --output-path coverage.lcov
      
      - name: Upload to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # This is v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.lcov

